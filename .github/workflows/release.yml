name: Release

# Push a tag like v1.2.0 and this builds a signed APK and publishes it as a GitHub release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          # Tolerate line breaks, spaces and Windows line endings from a pasted value.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64 (${#KEYSTORE_BASE64} characters). Copy it again with the PowerShell command in RELEASING.md and update the secret."
            exit 1
          fi
          # Open the key now, so a wrong password or alias is reported here and not as a build failure.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The key file decoded ($(wc -c < "$RUNNER_TEMP/release.jks") bytes) but did not open with KEYSTORE_PASSWORD and KEY_ALIAS. Check both secrets."
            exit 1
          fi
          echo "Signing key restored: alias $KEY_ALIAS, $(wc -c < "$RUNNER_TEMP/release.jks") bytes."

      - name: Build the release APK
        env:
          COVERDECK_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          COVERDECK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          COVERDECK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          COVERDECK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PversionName="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "CoverDeck-${GITHUB_REF_NAME}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: CoverDeck-${{ github.ref_name }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
