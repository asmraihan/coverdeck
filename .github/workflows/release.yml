name: Release

# Push a tag like v1.2.0 and this builds a signed APK and publishes it as a GitHub release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          # Tolerate line breaks and Windows line endings from a pasted value.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the release APK
        env:
          COVERDECK_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          COVERDECK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          COVERDECK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          COVERDECK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PversionName="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "CoverDeck-${GITHUB_REF_NAME}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: CoverDeck-${{ github.ref_name }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
